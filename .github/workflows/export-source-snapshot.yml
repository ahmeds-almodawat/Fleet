name: Export Source Snapshot

on:
  push:
    branches:
      - automation/fleet-remediation-20260831

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source snapshot
        run: |
          zip -r fleet-source-snapshot.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'dist/*'

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fleet-source-snapshot
          path: fleet-source-snapshot.zip
          if-no-files-found: error
          retention-days: 1
